services:
  backend:
    build: ./Código/10-MERN-Todo/backend
    container_name: mern-todo-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/mern_todo
    depends_on:
      - mongodb
    networks:
      - mern-network

  frontend:
    build: ./Código/10-MERN-Todo/frontend
    container_name: mern-todo-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - mern-network

  mongodb:
    image: mongo:7
    container_name: mern-todo-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network

networks:
  mern-network:

volumes:
  mongo-data: