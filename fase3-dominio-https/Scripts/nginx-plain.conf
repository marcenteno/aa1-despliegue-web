
# Configuración del sitio web Plain
# Dominio: plainweb.work.gd
# Servidor web: Nginx

# Servidor HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name plainweb.work.gd www.plainweb.work.gd;

    root /var/www/plain;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Certificado SSL de Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/plainweb.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plainweb.work.gd/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirección de HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name plainweb.work.gd www.plainweb.work.gd;

    return 301 https://$host$request_uri;
}
